<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Grade Horária Escolar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ficha de secretaria — cabeçalho com etapas numeradas, painéis de formulário, grades em células coloridas por disciplina */
:root{
  --bg:#edf1f3; --surface:#ffffff; --surface-2:#f4f7f8; --ink:#15212a; --muted:#566874; --line:#d3dce2;
  --accent:#17607f; --accent-ink:#ffffff; --accent-soft:#dcecf3;
  --good:#257a4a; --good-soft:#dff2e6; --warn:#9a5b06; --warn-soft:#fbefd8; --bad:#c23a2b; --bad-soft:#fbe3df;
  --hatch:#dfe5e9; --chipL:93%; --chipC:0.055; --chipInk:#1a2830;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#162129; --surface-2:#1b2831; --ink:#e3ebf0; --muted:#93a6b2; --line:#2a3a45;
  --accent:#5ab0d3; --accent-ink:#06151c; --accent-soft:#183746;
  --good:#5cc489; --good-soft:#163222; --warn:#e2a548; --warn-soft:#3a2c14; --bad:#f07563; --bad-soft:#3d1f1b;
  --hatch:#24333d; --chipL:33%; --chipC:0.05; --chipInk:#e8eff3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#162129; --surface-2:#1b2831; --ink:#e3ebf0; --muted:#93a6b2; --line:#2a3a45;
  --accent:#5ab0d3; --accent-ink:#06151c; --accent-soft:#183746;
  --good:#5cc489; --good-soft:#163222; --warn:#e2a548; --warn-soft:#3a2c14; --bad:#f07563; --bad-soft:#3d1f1b;
  --hatch:#24333d; --chipL:33%; --chipC:0.05; --chipInk:#e8eff3; color-scheme:dark }

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.brand{padding-block:22px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px 20px;flex-wrap:wrap}
.brand > div{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.45rem,3.2vw,2.05rem);line-height:1.1;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
nav.steps{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.step{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 11px;font:inherit;font-size:.9rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.step:hover{color:var(--ink)}
.step .num{font-family:var(--f-mono);font-size:.72rem;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.step[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.step[aria-current="step"] .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step[disabled]{opacity:.4;cursor:not-allowed}
.step .st{width:7px;height:7px;border-radius:50%}
.st.ok{background:var(--good)} .st.warn{background:var(--warn)} .st.bad{background:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:22px 72px;display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0;display:grid;gap:16px}
.panel.subtle{background:var(--surface-2)}
.panel-h{display:grid;gap:4px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0}
.lede{margin:0;color:var(--muted);max-width:68ch}
.hint{margin:0;color:var(--muted);font-size:.86rem;max-width:72ch}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 18px}
.fld{display:grid;gap:5px;font-size:.85rem;color:var(--muted)}
.fld > span{font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.8rem;box-sizing:border-box}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;grid-column:1/-1}
.chk input{margin-top:4px}
.btn{appearance:none;font:inherit;font-size:.9rem;font-weight:500;border-radius:7px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between}
.tscroll{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}

table.list{border-collapse:collapse;width:100%;font-size:.9rem}
.list th{text-align:left;font-family:var(--f-mono);font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.list td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.list tfoot td{border-bottom:0;font-family:var(--f-mono);font-size:.82rem}
.list input[type=number]{width:62px}
.list .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.list .sm{font-size:.82rem;color:var(--muted)}
.w-name{min-width:170px;width:100%}
.w-sig{width:74px;text-transform:uppercase}

.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.74rem;padding:2px 8px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* horários (regimes) */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.hcard{border:1px solid var(--line);border-radius:9px;padding:14px;display:grid;gap:12px;min-width:0;background:var(--surface)}
.hcard .hn{font-family:var(--f-display);font-weight:600;font-size:1.02rem;flex:1 1 180px}
.hcard input[type=time]{font-family:var(--f-mono)}
.hrow{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:flex-end}
.hrow .fld input{width:110px}
.ivs{display:grid;gap:6px}
.iv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.iv select{padding:5px 4px}
.iv input{padding:5px 6px}
.iv .ivn{width:120px}
.iv .ivm{width:64px}
.tl{display:flex;height:30px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.seg{min-width:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:.68rem;background:var(--accent-soft);color:var(--ink);border-right:1px solid var(--surface);overflow:hidden;white-space:nowrap}
.seg.brk{background:repeating-linear-gradient(45deg,var(--warn-soft) 0 4px,var(--surface) 4px 8px);color:var(--warn)}
.seg:last-child{border-right:0}
.tl-meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);gap:8px;flex-wrap:wrap}
details.times summary{cursor:pointer;font-size:.85rem;color:var(--accent)}
.tlist{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:.82rem;margin-top:8px;font-variant-numeric:tabular-nums}
.tlist .b{color:var(--warn)}
.tlist .t{font-family:var(--f-mono)}
.seg-btns{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg-btns button{appearance:none;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-family:var(--f-mono);font-size:.85rem;padding:7px 12px;cursor:pointer}
.seg-btns button:last-child{border-right:0}
.seg-btns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.durrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.durrow input{width:80px}

/* matriz de atribuição */
table.mx{border-collapse:separate;border-spacing:0;font-size:.85rem}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:top}
.mx thead th{position:sticky;top:0;background:var(--surface);text-align:left;min-width:150px}
.mx thead th .tn{font-family:var(--f-display);font-weight:600;font-size:.98rem}
.mx thead th .rg{font-size:.74rem;color:var(--muted);display:block}
.mx tbody th{text-align:left;font-weight:500;position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;box-shadow:1px 0 0 var(--line)}
.mx .cl{display:flex;gap:4px;align-items:center}
.mx .cl input{width:48px;padding:5px 6px}
.mx .cl select{width:118px;padding:5px 4px;font-size:.8rem}
.mx td.zero .cl{opacity:.38}
.mx td.zero .cl:focus-within{opacity:1}
.mx input.ov{border-color:var(--warn)}
.dchips{display:flex;flex-wrap:wrap;gap:3px;min-width:220px;max-width:420px}
.dchip{appearance:none;font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.dchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dem td{vertical-align:top}
.dgrp{display:grid;gap:8px}
.eqv{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted);white-space:nowrap}
.eqv input{width:64px}
.eqv + .eqv{margin-top:4px}
.dtab input[type=number]{width:54px}
.dtab td.padc,.dtab th.padc{background:var(--surface-2)}
.dtab input.ov{border-color:var(--warn);background:var(--warn-soft)}
.dtab input.z{color:var(--muted)}
tr.grp td{font-family:var(--f-display);font-weight:600;font-size:.98rem;padding-top:14px;color:var(--accent);border-bottom:2px solid var(--accent-soft)}
tr.sub td{background:var(--surface-2);font-size:.8rem;color:var(--muted)}
td.conta{min-width:170px}
td.conta b{display:block;font-family:var(--f-mono)}
.resumo{display:grid;gap:2px}
.ivet{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px dashed var(--line);border-radius:7px}
.ivet.own{display:grid;border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.cg{display:grid;gap:2px;min-width:170px}
.cg > b{font-family:var(--f-mono);font-size:1rem}
.cg b.over{color:var(--bad)}
.qtab input[type=number]{width:62px}
.w-ano{width:130px}
.box{display:contents}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:9px;background:var(--surface);display:grid;min-width:0}
.pcard.on{border-color:var(--accent);background:var(--accent-soft)}
.pchk{appearance:none;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;width:100%;border-radius:9px}
.pchk .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent-ink);background:var(--surface)}
.pcard.on .pchk .box{background:var(--accent);border-color:var(--accent)}
.ptx{display:grid;gap:2px;min-width:0}
.ptx b{font-family:var(--f-display);font-weight:600;font-size:1rem}
.ptx .pd{font-size:.82rem;color:var(--muted)}
.ptx .ph{font-family:var(--f-mono);font-size:.76rem;color:var(--ink)}
.pwarn{padding:0 14px 14px;font-size:.85rem;color:var(--bad);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel.banner{border-color:var(--warn);background:var(--warn-soft)}
.autoP{font-style:italic;color:var(--accent)}
.calc2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:820px){.calc2{grid-template-columns:1fr}}
.plc{display:grid;gap:5px;min-width:250px}
.plc .pt{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.plc .pt input{width:56px}
.plc .pt select{padding:4px 4px;font-size:.78rem}
.plv{font-family:var(--f-mono);font-size:1rem;color:var(--ink)}
.pfx{display:flex;gap:3px}
.pfx label{display:grid;gap:1px;text-align:center;font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.pfx input{width:40px;padding:4px 3px;text-align:center}
.pfx input.on{border-color:var(--accent);background:var(--accent-soft)}
.gr td.pl{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--accent-soft) 6px 12px);color:var(--ink)}
.dem .over{color:var(--bad);font-weight:600}
.mx .rowp{margin-top:4px;width:100%;font-size:.75rem;padding:3px 4px;color:var(--muted)}

/* indisponibilidade */
.unav{display:grid;gap:10px;padding:6px 0 10px}
table.ugrid{border-collapse:separate;border-spacing:3px 2px}
.ugrid th{font-weight:500}
.mini{appearance:none;border:0;background:none;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:4px}
.mini:hover{color:var(--accent);background:var(--accent-soft)}
.ub{appearance:none;width:40px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono);color:var(--bad);font-size:.9rem}
.ub.on{background:repeating-linear-gradient(45deg,var(--bad-soft) 0 5px,var(--surface) 5px 10px);border-color:var(--bad)}
tr.tsep > *{padding-top:10px}

/* checagens */
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:.88rem}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px;background:var(--good)}
.checks li.warn::before{background:var(--warn)} .checks li.bad::before{background:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);width:0}
.prog{display:grid;gap:6px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}

/* resultados */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;background:var(--surface)}
.stat b{font-family:var(--f-mono);font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.bad{border-color:var(--bad);background:var(--bad-soft)} .stat.bad b{color:var(--bad)}
.stat.ok b{color:var(--good)}
.stat.warn b{color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-size:.9rem;padding:8px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:9px;padding:12px;display:grid;gap:8px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card-h h3{font-size:1.08rem}
table.gr{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed;min-width:460px}
.gr th{font-family:var(--f-mono);font-size:.68rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:2px}
.gr th.pl{width:84px;font-size:.64rem;letter-spacing:.02em;white-space:nowrap;text-align:right;padding-right:6px}
.gr td{height:44px;border-radius:6px;padding:4px 6px;vertical-align:top;font-size:.78rem;line-height:1.25;overflow:hidden}
.gr td.c{background:oklch(var(--chipL) var(--chipC) var(--h));color:var(--chipInk);cursor:pointer}
.gr td.c:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.gr td.e{background:var(--surface-2);border:1px dashed var(--line);cursor:pointer}
.gr td.x{background:none}
.gr td.na{background:repeating-linear-gradient(45deg,var(--hatch) 0 5px,transparent 5px 10px)}
.gr td.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.gr td.sel{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 2px var(--accent-soft)}
.gr .sg{font-family:var(--f-mono);font-weight:500;font-size:.78rem;display:block}
.gr .pf{display:block;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr tr.lunch td{height:auto;padding:0;text-align:center;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
table.qg{min-width:0;width:auto}
.qg td{min-width:92px;width:92px}
.qg tr.dsep th,.qg tr.dsep td{border-top:2px solid var(--line)}
.issues{margin:0;padding-left:18px;font-size:.86rem;display:grid;gap:3px}
.fb{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20;display:grid;gap:8px;box-shadow:0 -6px 20px rgb(0 0 0 / .12)}
.foot-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion: no-preference){.bar > i{transition:width .2s linear}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div><div class="eyebrow">Quadro de horários</div><h1 id="schoolTitle">Escola</h1></div>
      <div class="meta" id="meta"></div>
    </div>
    <nav class="steps" id="steps" aria-label="Etapas"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="fb" id="fb" hidden>
  <div class="row end"><b>Selecione o texto e copie (Ctrl+C)</b><button class="btn" data-k="closefb" id="fb-close">Fechar</button></div>
  <textarea id="fb-text" readonly></textarea>
</div>

<script>
/* ===================== Dados e utilidades ===================== */
const KEY = 'grade-horaria-v4';
const LIM_DEF = 18;
const DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS3 = ['Seg','Ter','Qua','Qui','Sex','Sáb'];
const W = {clash:100, unav:80, exc:40, empty:6, dist:4, gap:3, gem:4, plAlone:5, plFora:2};

let distMsg = '', hMsg = {};
let S, R = null, step = 0, openProf = null, resTab = 'turmas', sel = null, resetArmed = false, running = false, ver = 0, pendingFocus = null;
let idc = 0;

    for (let x = 0; x < np; x++) for (let y = 0; y < nd; y++) before += pdc[affP[x] * D + affD[y]];
    swapRaw(ti, i, j);
    const nt = turmaCost(ti); let after = nt, z = 0;
    for (let x = 0; x < np; x++) for (let y = 0; y < nd; y++){ const v = profDayCost(affP[x], affD[y]); newV[z++] = v; after += v; }
    const delta = after - before;
    if (delta <= 0 || Math.random() < Math.exp(-delta / temp)){
      tc[ti] = nt; z = 0;
      for (let x = 0; x < np; x++) for (let y = 0; y < nd; y++) pdc[affP[x] * D + affD[y]] = newV[z++];
      cur += delta;
    } else swapRaw(ti, i, j);
  }
  function movePL(k, g){ const p = PLs[k].p, o = plG[k], d1 = (o / U) | 0, d2 = (g / U) | 0; occ[p * PD + o]--; pday[p * D + d1]--; if (!ownM[p][o % U]) pout[p * D + d1]--; occ[p * PD + g]++; pday[p * D + d2]++; if (!ownM[p][g % U]) pout[p * D + d2]++; plG[k] = g; }
  function attemptPL(k, temp){
    const pl = PLs[k], g = pl.cand[(Math.random() * pl.cand.length) | 0], o = plG[k];
    if (g === o || o < 0) return;
    const p = pl.p, d1 = (o / U) | 0, d2 = (g / U) | 0;
    const before = pdc[p * D + d1] + (d2 !== d1 ? pdc[p * D + d2] : 0);
    movePL(k, g);
    const v1 = profDayCost(p, d1), v2 = d2 !== d1 ? profDayCost(p, d2) : 0;
    const delta = v1 + v2 - before;
    if (delta <= 0 || Math.random() < Math.exp(-delta / temp)){ pdc[p * D + d1] = v1; if (d2 !== d1) pdc[p * D + d2] = v2; cur += delta; }
    else movePL(k, o);
  }
  function conflictAt(p, g){
    if (unav[p][g]) return true;
    const d = (g / U) | 0, u = g % U, base = p * PD + d * U;
    if (occ[base + u] > 1) return true;
    for (let w = 0; w < U; w++) if (w !== u && occ[base + w] && uS[w] < uE[u] && uS[u] < uE[w]) return true;
    return false;
  }
  function run(ms, T0, onTick){
    return new Promise(res => {
      const t0 = performance.now(), T1 = 0.05, nL = L.length, hot = [], tot = nL + nPL;
      if (!tot){ onTick && onTick(1, cur, best); res(); return; }
      function chunk(){
        hot.length = 0;
        for (let l = 0; l < nL; l++){ const x = L[l]; if (x.p >= 0 && pos[l] >= 0 && conflictAt(x.p, T[x.t].slots[pos[l]])) hot.push(l); }
        for (let k = 0; k < nPL; k++) if (plG[k] >= 0 && conflictAt(PLs[k].p, plG[k])) hot.push(-1 - k);
        const end = performance.now() + 30; let frac = 0;
        while (performance.now() < end){
          frac = Math.min(1, (performance.now() - t0) / ms);
          const temp = T0 * Math.pow(T1 / T0, frac);
          for (let k = 0; k < 500; k++){
            const r = (hot.length && Math.random() < 0.5) ? hot[(Math.random() * hot.length) | 0] : (() => { const q = (Math.random() * tot) | 0; return q < nL ? q : -1 - (q - nL); })();
            if (r < 0){ attemptPL(-1 - r, temp); continue; }
            const i = pos[r]; if (i < 0) continue;
            const ti = L[r].t, j = (Math.random() * T[ti].slots.length) | 0;
            if (j !== i) attempt(ti, i, j, temp);
          }
          if (cur < best - 1e-9){ best = cur; bestSnap = snapshot(); }
          if (frac >= 1 || best <= 0) break;
        }
        onTick && onTick(frac, cur, best);
        if (frac >= 1 || best <= 0){ restore(bestSnap); best = cur; res(); }
        else setTimeout(chunk, 0);
      }
      setTimeout(chunk, 0);
    });
  }
  function report(){
    const byPG = new Map(), plAt = new Map(), bad = new Set();
    for (let l = 0; l < L.length; l++){ const x = L[l]; if (x.p < 0 || pos[l] < 0) continue; const k = x.p * PD + T[x.t].slots[pos[l]]; if (!byPG.has(k)) byPG.set(k, []); byPG.get(k).push(l); }
    for (let k = 0; k < nPL; k++){ const g = plG[k]; if (g < 0) continue; const key = PLs[k].p * PD + g; plAt.set(key, (plAt.get(key) || 0) + 1); }
    let nClash = 0, nUnav = 0, nExc = 0, gaps = 0, alone = 0; const items = [];
    for (let p = 0; p < nP; p++) for (let d = 0; d < D; d++){
      const base = p * PD + d * U, ls = [];
      for (let u = 0; u < U; u++){ const a = byPG.get(base + u); if (a) for (const l of a) ls.push({l, u}); const n = plAt.get(base + u) || 0; for (let z = 0; z < n; z++) ls.push({l: -1, u}); }
      for (let i = 0; i < ls.length; i++){
        const A = ls[i];
        if (unav[p][d * U + A.u]){ nUnav++; if (A.l >= 0) bad.add(A.l); items.push({type:'unav', p, d, ls:[A]}); }
        for (let j = i + 1; j < ls.length; j++){ const B = ls[j]; if (uS[B.u] < uE[A.u] && uS[A.u] < uE[B.u]){ nClash++; if (A.l >= 0) bad.add(A.l); if (B.l >= 0) bad.add(B.l); items.push({type:'clash', p, d, ls:[A, B]}); } }
      }
      const pt = profDay(p, d, true); gaps += pt.gaps; alone += pt.alone;
    }
    T.forEach((t, ti) => { for (let d = 0; d < D; d++){ const c = new Map();
      for (const q of t.dayIdx[d]){ const l = t.cont[q]; if (l >= 0) c.set(L[l].d, (c.get(L[l].d) || 0) + 1); }
      for (const [dd, n] of c) if (n > mxD[dd]){ nExc += n - mxD[dd]; items.push({type:'exc', ti, d, dd, n}); } } });
    return {nClash, nUnav, nExc, gaps, alone, items, byPG, plAt, bad, nPL};
  }
  function manualSwap(ti, i, j){ swapRaw(ti, i, j); cur = total(); }
  return {m, init, run, report, manualSwap, PD, profGaps: (p, d) => profDay(p, d, true).gaps, cost: () => cur};
}

/* ===================== Validação ===================== */
function validar(){
  const errs = [], warns = []; let semProf = 0;
  const D = S.escola.dias;
  if (!S.turmas.length) errs.push('Cadastre ao menos uma turma.');
  if (!S.disciplinas.length) errs.push('Cadastre ao menos uma disciplina.');
  const pl = new Map(S.professores.map(p => [p.id, {tot:0, byH: new Map()}]));
  for (const t of S.turmas){
    const h = hOf(t); let tot = 0; const cap = capacidade(h);
    for (const d of S.disciplinas){
      const n = aulas(t, d); if (!n) continue; tot += n;
      const pid = profOf(t, d);
      if (!pid || !pl.has(pid)){ semProf++; warns.push(`${t.nome || 'Turma sem nome'} · ${d.nome}: ${n} aula(s) sem professor.`); continue; }
      const x = pl.get(pid), kk = tlKey(t); x.tot += n; x.byH.set(kk, (x.byH.get(kk) || 0) + n);
    }
    for (const d of S.disciplinas){ const n = aulas(t, d), r = regraDisc(d); if (n > r.mx * S.escola.dias) errs.push(`${t.nome} · ${d.nome}: ${n} aulas na semana, mas o máximo é ${r.mx} por dia (${r.mx * S.escola.dias} na semana). Aumente o máximo por dia na etapa Disciplinas.`); }
    if (tot > cap) errs.push(`${t.nome}: ${tot} aulas previstas para ${cap} horários na semana (sobram ${tot - cap}). Reduza a carga na etapa Atribuição.`);
    else if (tot < cap) warns.push(`${t.nome}: ${cap - tot} horário(s) vago(s) na semana. O algoritmo tenta deixá-los no fim do dia.`);
  }
  for (const p of S.professores){
    const x = pl.get(p.id); if (!x.tot) continue;
    if (x.tot > p.limite) errs.push(`${p.nome}: ${x.tot} aulas atribuídas, acima do limite de ${p.limite} por semana.`);
    const nPL = plTotal(p), fxE = plFixEff(p);
    const blocked = (d, s, e) => isBlocked(p, d, s, e);
    let maxAll = 0;
    for (let d = 0; d < D; d++){ // máximo de aulas sem sobreposição no dia (escalonamento por término mais cedo)
      const iv = [];
      for (const kk of x.byH.keys()) for (const a of tlOfKey(kk).aulas) if (!blocked(d, a.s, a.e)) iv.push(a);
      iv.sort((a, b) => a.e - b.e); let end = -1;
      for (const a of iv) if (a.s >= end){ maxAll++; end = a.e; }
    }
    const capE = capRelogio(p, chavesEscola());
    if (x.tot > maxAll){ errs.push(`${p.nome}: ${x.tot} aulas, mas só cabem ${maxAll} nos turnos e horários em que está disponível.`); continue; }
    if (x.tot + nPL > capE){ errs.push(`${p.nome}: ${x.tot} aulas + ${nPL} PLs não cabem nos ${capE} horários da escola. Reduza os PLs do período ou as aulas por turma.`); continue; }
    for (let d = 0; d < D; d++){ const f = fxE[d] || 0; if (!f) continue; let cap = 0;
      const iv = []; for (const kk of chavesEscola()) for (const a of tlOfKey(kk).aulas) if (!blocked(d, a.s, a.e)) iv.push(a);
      iv.sort((a, b) => a.e - b.e); let end = -1; for (const a of iv) if (a.s >= end){ cap++; end = a.e; }
      if (f > cap) errs.push(`${p.nome}: ${f} PLs fixos na ${DIAS[d].toLowerCase()}, mas só há ${cap} horários livres nesse dia.`); }
    for (const [kk, n] of x.byH){
      const h = byId(S.horarios, kk.split('|')[0]); let free = 0;
      for (let d = 0; d < D; d++) for (const a of tlOfKey(kk).aulas) if (!blocked(d, a.s, a.e)) free++;
      if (n > free) errs.push(`${p.nome}: ${n} aulas em turmas do horário “${h.nome}”, mas só ${free} horários livres nele.`);
    }
  }
  return {errs, warns, semProf};
}

const STEPS = ['Etapa e períodos','Escola e horários','Turmas','Disciplinas','Professores','Atribuição','Gerar grade'];
const LAST = STEPS.length - 1;
const liberado = i => i === 0 || (S.periodosOk && S.horarios.length > 0 && S.etapas.length > 0);
function stepState(i){
  if (i === 0) return liberado(1) ? 'ok' : 'warn';
  if (!liberado(i)) return '';
  i -= 1;
  if (i === 0) return 'ok';
  if (i === 1) return S.turmas.length ? 'ok' : 'warn';
  if (i === 2) return S.disciplinas.length ? 'ok' : 'warn';
  if (i === 3) return !S.professores.length ? 'warn' : S.professores.some(p => profLoad(p.id) > p.limite) ? 'bad' : 'ok';
  if (i === 4){ const v = validar(); return v.errs.length ? 'bad' : (v.semProf ? 'warn' : 'ok'); }
  if (i === 5) return R ? ((R.rep.nClash + R.rep.nUnav) ? 'bad' : 'ok') : '';
  return 'ok';
}
function renderSteps(){
  document.getElementById('steps').innerHTML = STEPS.map((s, i) => { const st = stepState(i);

function etOn(id){
  if (S.etapas.includes(id)) return;

  for (const d of discsDaEtapa(id)) if (!byId(S.disciplinas, d.id)) S.disciplinas.push(d);
}
function etOff(id){
  const anos = new Set(S.anos.filter(a => a.etapa === id).map(a => a.id));
  const rmT = new Set(S.turmas.filter(t => anos.has(t.ano)).map(t => t.id));
  S.turmas = S.turmas.filter(t => !rmT.has(t.id)); rmT.forEach(t => delete S.atrib[t]);
  S.anos = S.anos.filter(a => !anos.has(a.id));
  const rmD = new Set(S.disciplinas.filter(d => d.etapa === id).map(d => d.id));
  S.disciplinas = S.disciplinas.filter(d => !rmD.has(d.id));
  for (const t in S.atrib) for (const d of rmD) delete S.atrib[t][d];
  S.professores.forEach(p => { p.discs = p.discs.filter(x => !rmD.has(x)); });

}

function letraLivre(ano){
  const usadas = new Set(S.turmas.filter(t => t.ano === ano.id).map(t => (t.nome || '').trim().slice(-1).toUpperCase()));
  for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') if (!usadas.has(c)) return c;
  return String(S.turmas.length + 1);
}
function setQtd(aid, hid, n){
  const ano = byId(S.anos, aid); if (!ano) return;
  const cur = turmasDe(aid, hid);
  for (let k = cur.length; k < n; k++) S.turmas.push({id: nid('t'), nome: `${ano.curto || ano.nome} ${letraLivre(ano)}`, h: hid, ano: aid});
  if (n < cur.length){
    const rm = new Set(cur.slice().sort((a, b) => b.nome.localeCompare(a.nome, 'pt')).slice(0, cur.length - n).map(t => t.id));
    S.turmas = S.turmas.filter(t => !rm.has(t.id)); rm.forEach(id => delete S.atrib[id]);
  }
}
/* mínimo de professores por disciplina: cada turma inteira com um professor, sem passar do limite (encaixe decrescente) */
function minProfs(d){
  const items = S.turmas.map(t => ({n: aulas(t, d), lim: hOf(t).limite || LIM_DEF})).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
  const bins = [];
  for (const x of items){ let bi = -1, br = Infinity; bins.forEach((r, i) => { if (r >= x.n && r - x.n < br){ br = r - x.n; bi = i; } }); if (bi >= 0) bins[bi] -= x.n; else bins.push(Math.max(x.lim, x.n) - x.n); }
  return bins.length;
}

/* --- 4 Professores --- */
/* carga do professor = soma, por disciplina, de (aulas por turma × nº de turmas) */
function cargaProf(p){
  const porD = new Map(); let tot = 0;
  for (const t of S.turmas) for (const d of S.disciplinas){ if (profOf(t, d) !== p.id) continue; const n = aulas(t, d); if (!n) continue; tot += n;
    if (!porD.has(d.id)) porD.set(d.id, {d, grupos: new Map(), turmas: []}); const x = porD.get(d.id); x.grupos.set(n, (x.grupos.get(n) || 0) + 1); x.turmas.push(t.nome); }
  const linhas = [...porD.values()].map(x => { const parts = [...x.grupos].sort((a, b) => b[0] - a[0]).map(([n, q]) => `${n} aula${n > 1 ? 's' : ''} × ${q} turma${q > 1 ? 's' : ''}`);
    const sub = [...x.grupos].reduce((s, [n, q]) => s + n * q, 0); return {sig: dLabel(x.d), txt: parts.join(' + '), sub, turmas: x.turmas}; });
  return {tot, linhas};
}
function profInfo(p){
  let tot = 0; const map = new Map();
  for (const t of S.turmas) for (const d of S.disciplinas){ if (profOf(t, d) !== p.id) continue; const n = aulas(t, d); if (!n) continue; tot += n; const k = dLabel(d); if (!map.has(k)) map.set(k, []); map.get(k).push(t.nome); }
  return {tot, txt: [...map].map(([s, ts]) => `${s}: ${ts.join(', ')}`).join(' · ')};
}
const cellKey = (d, m) => d + '-' + hm(m).replace(':', '');

  for (let d = 0; d < D; d++) h += `<th><button class="mini" data-k="unavDay" data-id="${p.id}" data-d="${d}">${DIAS3[d]}</button></th>`;
  h += '</tr></thead><tbody>';

    h += `<tr${m === 720 ? ' class="tsep"' : ''}><th><button class="mini" data-k="unavRow" data-id="${p.id}" data-m="${m}">${hm(m)}</button></th>`;
    for (let d = 0; d < D; d++){ const k = cellKey(d, m), on = blk.has(k); h += `<td><button class="ub ${on ? 'on' : ''}" id="ub-${p.id}-${k}" data-k="unav" data-id="${p.id}" data-s="${k}" aria-pressed="${on}" aria-label="${DIAS[d]}, ${hm(m)} a ${hm(m + 30)}">${on ? '×' : ''}</button></td>`; }
    h += '</tr>';
  }
  return h + '</tbody></table></div></div>';
}
function plFormula(p){
  const g = new Map(); for (const [hid, n] of aulasPorHorario(p)){ const h = byId(S.horarios, hid); if (!h) continue; const k = h.pl + '/' + h.limite; g.set(k, (g.get(k) || 0) + n); }
  const parts = [...g].map(([k, n]) => `${n} aulas × ${k}`);
  return parts.length ? `= ${parts.join(' + ')}` : 'sem aulas';
}

    <div class="pfx">${range(0, D).map(d => `<label><span>${DIAS3[d]}</span><input type="number" min="0" max="14" id="pf-${p.id}-${d}" data-c="pfix" data-id="${p.id}" data-d="${d}" value="${p.plFix[d] || 0}" class="${p.plFix[d] ? 'on' : ''}" aria-label="PLs fixos na ${DIAS[d]}"></label>`).join('')}</div>

function demandaHTML(){
  const rows = S.disciplinas.map(d => {

    const hab = habilitados(d.id);

function gruposQuadro(){
  const ks = [...new Set(S.turmas.map(tlKey))], out = [];

}
function lessonTxt(ti, i, withTurma){
  const l = R.m.T[ti].cont[i]; if (l < 0) return '';
  const x = R.m.L[l], d = S.disciplinas[x.d], p = x.p >= 0 ? S.professores[x.p].nome : '';
  return (withTurma ? S.turmas[ti].nome + ' - ' : '') + (d.sigla || d.nome) + (p ? ' (' + p + ')' : '');
}
function buildTSV(){
  const D = S.escola.dias, m = R.m, out = [];
  const hdr = ['Horário', ...range(0, D).map(d => DIAS[d])].join('\t');
  if (resTab === 'turmas'){
    S.turmas.forEach((tu, ti) => { const t = m.T[ti]; out.push(tu.nome + '\t' + hOf(tu).nome, hdr);
      t.tl.aulas.forEach((a, k) => {
        out.push([`${k + 1}ª ${hm(a.s)}-${hm(a.e)}`, ...range(0, D).map(d => lessonTxt(ti, d * t.n + k))].join('\t'));
        for (const p of t.tl.pausas) if (p.after === k) out.push(`${p.nome} ${hm(p.s)}-${hm(p.e)}`);
      });
      out.push(''); });
  } else if (resTab === 'geral'){
    for (const [hh, kk, rot] of gruposQuadro()){
      const tis = S.turmas.map((t, i) => [t, i]).filter(([t]) => tlKey(t) === kk); if (!tis.length) continue;
      const tl = m.T[tis[0][1]].tl;
      out.push(rot, ['Dia', 'Horário', ...tis.map(([t]) => t.nome)].join('\t'));
      for (let d = 0; d < D; d++) tl.aulas.forEach((a, k) => out.push([DIAS[d], `${k + 1}ª ${hm(a.s)}-${hm(a.e)}`, ...tis.map(([, ti]) => lessonTxt(ti, d * m.T[ti].n + k))].join('\t')));
      out.push('');
    }
  } else {
    S.professores.forEach((p, pi) => { if (!m.L.some(x => x.p === pi) && !m.PLs.some(x => x.p === pi)) return; out.push(p.nome, hdr);
      for (let u = 0; u < m.U; u++){
        const cells = range(0, D).map(d => { const key = pi * R.solver.PD + d * m.U + u, ls = R.rep.byPG.get(key) || [], np = R.rep.plAt.get(key) || 0;
          return [...ls.map(l => { const x = m.L[l]; return S.turmas[x.t].nome + ' - ' + (S.disciplinas[x.d].sigla || S.disciplinas[x.d].nome); }), ...range(0, np).map(() => 'PL')].join(' / '); });
        if (cells.some(Boolean)) out.push([`${hm(m.uS[u])}-${hm(m.uE[u])}`, ...cells].join('\t'));
      }
      out.push(''); });
  }
  return out.join('\n');
}

  });

      S.turmas.forEach(t => { if (t.h === id) t.h = S.horarios[0].id; }); S.disciplinas.forEach(d => delete d.carga[id]); changed(); render(); return; }
    case 'discTab': discH = id; render(); return;
    case 'addIv': { const h = byId(S.horarios, id), et = b.dataset.et || '', lst = et ? h.ivEt[et] : h.intervalos; const used = new Set(lst.map(iv => iv.apos)); let a = Math.min(h.aulas - 1, et ? 2 : 3); while (used.has(a) && a < h.aulas - 1) a++;
      lst.push({apos: a, min: 15, nome: et ? 'Recreio' : 'Intervalo'}); pendingFocus = `ivn-${id}-${et}-${lst.length - 1}`; changed(); render(); return; }
    case 'delIv': { const h = byId(S.horarios, id), et = b.dataset.et || ''; (et ? h.ivEt[et] : h.intervalos).splice(+b.dataset.x, 1); changed(); render(); return; }
    case 'ivEtOn': { const h = byId(S.horarios, id); h.ivEt = h.ivEt || {}; h.ivEt[b.dataset.et] = h.intervalos.map(iv => ({...iv})); changed(); render(); return; }
    case 'ivEtOff': { const h = byId(S.horarios, id); if (h.ivEt) delete h.ivEt[b.dataset.et]; changed(); render(); return; }
    case 'addT': { const last = S.turmas[S.turmas.length - 1]; const t = {id: nid('t'), nome: `Turma ${S.turmas.length + 1}`, h: last ? last.h : S.horarios[0].id, ano: last ? last.ano : (S.anos[0]?.id || '')}; S.turmas.push(t); pendingFocus = 'tn-' + t.id; changed(); render(); return; }
    case 'addAno': { const a = {id: nid('a'), nome: '', curto: ''}; S.anos.push(a); pendingFocus = 'an-nome-' + a.id; changed(); render(); return; }
    case 'delAno': S.anos = S.anos.filter(a => a.id !== id); S.turmas.forEach(t => { if (t.ano === id) t.ano = ''; }); changed(); render(); return;
    case 'criarDist': { distribuirTodas(); const n = criarFaltantes(); const rest = S.disciplinas.reduce((s, d) => s + demandaInfo(d).un, 0);
      distMsg = `${n} professor(es) criado(s) e turmas distribuídas.` + (rest ? ` Ainda faltam ${rest} aulas sem professor.` : ' Veja e renomeie na etapa Professores.'); changed(); render(); return; }
    case 'delT': S.turmas = S.turmas.filter(t => t.id !== id); delete S.atrib[id]; if (autoOn()) ajustarEquipe(); changed(); render(); return;
    case 'addD': { const d = {id: nid('d'), etapa: b.dataset.etapa || '', nome: 'Nova disciplina', sigla: '', carga: {}, c: {}, gem: 'nao', maxDia: null}; S.disciplinas.push(d); pendingFocus = 'dn-' + d.id; changed(); render(); return; }
    case 'delD': S.disciplinas = S.disciplinas.filter(d => d.id !== id); for (const t in S.atrib) delete S.atrib[t][id]; changed(); render(); return;
    case 'addP': { const p = {id: nid('p'), nome: `Professor(a) ${S.professores.length + 1}`, limite: S.horarios[0]?.limite || LIM_DEF, plModo: 'auto', pl: 0, plFix: [0,0,0,0,0,0], discs: [], indisp: []}; S.professores.push(p); pendingFocus = 'pn-' + p.id; changed(); render(); return; }
    case 'delP': S.professores = S.professores.filter(p => p.id !== id); for (const t in S.atrib) for (const d in S.atrib[t]) if (S.atrib[t][d].prof === id) S.atrib[t][d].prof = ''; if (openProf === id) openProf = null; changed(); render(); return;
    case 'pdisc': { const p = byId(S.professores, id), did = b.dataset.d; p.auto = false; p.discs = p.discs.includes(did) ? p.discs.filter(x => x !== did) : [...p.discs, did]; pendingFocus = null; changed(); render(); return; }
    case 'distD': { const d = byId(S.disciplinas, b.dataset.d), un = distribuir(d.id); distMsg = un ? `${d.nome}: faltam ${un} aulas sem professor.` : `${d.nome} distribuída.`; changed(); render(); return; }
    case 'distAll': { const un = distribuirTodas(); distMsg = un ? `Distribuição feita; ${un} aulas ficaram sem professor.` : 'Todas as disciplinas distribuídas dentro dos limites.'; changed(); render(); return; }
    case 'criarFalt': { const n = criarFaltantes(); const rest = S.disciplinas.reduce((s, d) => s + demandaInfo(d).un, 0); distMsg = `${n} professor(es) criado(s).` + (rest ? ` Ainda faltam ${rest} aulas (alguma turma tem mais aulas do que o limite permite).` : ''); changed(); render(); return; }
    case 'toggleP': openProf = openProf === id ? null : id; render(); return;
    case 'unav': { byId(S.professores, id).auto = false; toggleUnav(byId(S.professores, id), [b.dataset.s]); pendingFocus = b.id; changed(); render(); return; }
    case 'unavDay': { const {a, b: z} = cellRange(), d = +b.dataset.d, ks = []; for (let m = a; m < z; m += 30) ks.push(cellKey(d, m)); byId(S.professores, id).auto = false; toggleUnav(byId(S.professores, id), ks); changed(); render(); return; }
    case 'unavRow': { const m = +b.dataset.m; byId(S.professores, id).auto = false; toggleUnav(byId(S.professores, id), range(0, S.escola.dias).map(d => cellKey(d, m))); changed(); render(); return; }
    case 'gerar': gerar(false); return;
    case 'otimizar': gerar(true); return;
    case 'tab': resTab = b.dataset.tab; sel = null; render(); return;
    case 'cell': {
      if (!R || running) return; const ti = +b.dataset.t, i = +b.dataset.i;
      if (!sel || sel.ti !== ti) sel = {ti, i};
      else if (sel.i === i) sel = null;
      else { R.solver.manualSwap(ti, sel.i, i); R.rep = R.solver.report(); sel = null; }
      const y = window.scrollY; render(); window.scrollTo({top: y}); return;
    }
    case 'copy': if (R) copyText(buildTSV(), b); return;
    case 'copyjson': copyText(JSON.stringify(S), b); return;
    case 'import': { const raw = document.getElementById('imp').value.trim(); if (!raw) return;
      try { S = normalize(JSON.parse(raw)); openProf = null; changed(); render(); } catch(err){ b.textContent = 'Texto inválido: cole os dados completos'; setTimeout(() => { b.textContent = 'Importar'; }, 2500); } return; }
    case 'sample': loadSample(); openProf = null; step = 0; rmPend = null; changed(); render(); return;
    case 'reset': if (!resetArmed){ resetArmed = true; render(); return; }
      resetArmed = false; S = normalize({escola: {nome: 'Minha escola'}}); S.exemplo = false; openProf = null; step = 0; changed(); render(); return;
    case 'minha': if (/exemplo/i.test(S.escola.nome)) S.escola.nome = 'Minha escola'; S.turmas = []; S.professores = []; S.atrib = {}; S.horarios = []; S.etapas = []; S.anos = []; S.disciplinas = []; S.periodosOk = false; S.exemplo = false; openProf = null; distMsg = ''; changed(); step = 0; render(); window.scrollTo({top: 0}); return;
    case 'manterEx': S.exemplo = false; save(); render(); return;
    case 'zerarQ': S.turmas = S.turmas.filter(t => !t.ano); for (const id in S.atrib) if (!byId(S.turmas, id)) delete S.atrib[id]; if (autoOn()) ajustarEquipe(); changed(); render(); return;
    case 'closefb': document.getElementById('fb').hidden = true; return;
  }
}
if (main){
  load();
  main.addEventListener('input', onInput);
  main.addEventListener('change', onChange);
  document.addEventListener('click', onClick);
  render();
}
</script>
