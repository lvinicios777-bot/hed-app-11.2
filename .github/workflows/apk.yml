name: Gerar APK

on:
  push:
    branches: [main, grade-horaria]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar a página para dentro do app
        run: cp web/index.html app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk GradeHoraria.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GradeHoraria-apk
          path: GradeHoraria.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grade-horaria-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Grade Horária 1.0.${{ github.run_number }}
          body: |
            APK para Android 7 ou superior.
            Baixe **GradeHoraria.apk** abaixo, abra no celular e permita a instalação de fontes desconhecidas quando o Android pedir.
          files: GradeHoraria.apk
          make_latest: false
