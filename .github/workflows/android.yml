name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Buildozer (versões fixas que funcionam juntas)
        run: pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70" virtualenv chess certifi

      - name: Cache do Stockfish
        id: cache-sf
        uses: actions/cache@v4
        with:
          path: libs/arm64-v8a/libstockfish.so
          key: stockfish-sf_19-arm64-api24-pie

      - name: Compilar Stockfish 19 para Android arm64
        if: steps.cache-sf.outputs.cache-hit != 'true'
        run: |
          NDKV="27.2.12479018"
          SDK=/usr/local/lib/android/sdk
          echo "y" | $SDK/cmdline-tools/latest/bin/sdkmanager "ndk;$NDKV" > /dev/null
          export PATH=$SDK/ndk/$NDKV/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish sf
          cd sf/src
          make net
          # PIE dinâmico (padrão oficial do Stockfish para Android: -pie -static-libstdc++);
          # o antigo "-static" gerava executável estático não-PIE, que não iniciava no aparelho
          make -j4 build ARCH=armv8 COMP=ndk CXX=aarch64-linux-android24-clang++
          make strip ARCH=armv8 COMP=ndk
          file stockfish
          ls -lh stockfish
          cd ../..
          mkdir -p libs/arm64-v8a
          cp sf/src/stockfish libs/arm64-v8a/libstockfish.so

      - name: Lc0 0.33 (binário oficial para Android, arm64)
        run: |
          mkdir -p libs/arm64-v8a
          cp motores/liblc0.so libs/arm64-v8a/liblc0.so
          python - <<'PY'
          import struct
          t = struct.unpack('<H', open('libs/arm64-v8a/liblc0.so', 'rb').read(18)[16:18])[0]
          assert t == 3, 'Lc0 não é PIE'
          print('Lc0 PIE ok')
          PY

      - name: Conferir formato do Stockfish (precisa ser PIE para o Android)
        run: |
          file libs/arm64-v8a/libstockfish.so
          python - <<'PY'
          import struct
          t = struct.unpack('<H', open('libs/arm64-v8a/libstockfish.so', 'rb').read(18)[16:18])[0]
          print('tipo ELF:', t, '(3 = PIE)')
          assert t == 3, 'Stockfish não é PIE: o Android não vai executá-lo'
          PY

      # Assinatura FIXA: sem isto cada build gera uma chave "debug" nova e o Android recusa
      # instalar por cima ("conflito com um pacote já existente").
      - name: Chave de assinatura fixa
        id: chave
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hed-chave-assinatura-v1

      - name: Criar a chave (só na primeira vez)
        if: steps.chave.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 20000 \
            -dname "CN=HED,O=Lucas,C=BR"

      - name: Conferir que a chave é a mesma das versões anteriores
        run: |
          impressao=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | grep -m1 "SHA256:" | awk '{print $2}')
          echo "Impressão digital da chave: $impressao"
          if [ -f assinatura.sha256 ]; then
            esperado=$(tr -d ' :\n' < assinatura.sha256 | tr 'A-F' 'a-f')
            atual=$(echo "$impressao" | tr -d ':' | tr 'A-F' 'a-f')
            if [ "$atual" != "$esperado" ]; then
              echo "::error::A chave de assinatura mudou (cache perdido). O APK não instalaria por cima; build interrompido."
              exit 1
            fi
          fi

      - name: Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ hashFiles('buildozer.spec') }}

      - name: Testar núcleo
        run: python hed_core.py && python hed_auto.py && python hed_plano.py && python hed_livro.py && python hed_classe.py && python hed_revisao.py

      - name: Testar Lichess (nuvem, sem token — não bloqueia o build)
        continue-on-error: true
        run: |
          python -c "
          import hed_fontes as F, chess
          b = chess.Board('r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq - 3 3')
          ops, prof = F.nuvem(b, 3)
          print('profundidade', prof)
          for o in ops: print(F.linha_texto(o, F.melhor_cp(ops)))
          "

      - name: Gerar APK
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Conferir Stockfish e Lc0 dentro do APK
        run: unzip -l bin/*.apk | grep -E "libstockfish.so|liblc0.so"; unzip -l bin/*.apk | grep -q liblc0.so

      - name: Assinar o APK com a chave fixa
        run: |
          # o Gradle assina com uma chave "Android Debug" própria, recriada a cada build;
          # reassinamos com a chave fixa (cache) para o Android aceitar atualizar por cima
          ASSINA=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner 2>/dev/null | tail -1)
          echo "apksigner: $ASSINA"
          [ -n "$ASSINA" ] || { echo "::error::apksigner não encontrado"; exit 1; }
          for f in bin/*.apk; do
            "$ASSINA" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey "$f"
          done

      - name: Conferir a assinatura do APK gerado
        run: |
          ASSINA=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner 2>/dev/null | tail -1)
          apk=$("$ASSINA" verify --print-certs bin/*.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}' | tr 'A-F' 'a-f')
          chave=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK:   $apk"
          echo "chave: $chave"
          "$ASSINA" verify --print-certs bin/*.apk | grep -m1 "certificate DN"
          if [ "$apk" != "$chave" ]; then
            echo "::error::O APK não está assinado com a chave fixa."
            exit 1
          fi
          if [ -f assinatura.sha256 ]; then
            esperado=$(tr -d ' :\n' < assinatura.sha256 | tr 'A-F' 'a-f')
            if [ "$apk" != "$esperado" ]; then
              echo "::error::A chave fixa mudou (cache perdido): o APK não instalaria por cima."
              exit 1
            fi
          fi

      - name: Mostrar erro (se falhar)
        if: failure()
        run: |
          echo "===== LINHAS COM ERRO ====="
          grep -n -i -E "error|exception|failed|not found" build.log | tail -40 || true
          echo "===== FINAL DO LOG ====="
          tail -150 build.log || true

      - name: Enviar log (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: hed-apk
          path: bin/*.apk

  # Testes de tela (Kivy sob xvfb, Stockfish real e um Lc0 falso): rodam junto com o build.
  testes-tela:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libegl1 libgles2 libmtdev1 libsdl2-2.0-0
          pip install "kivy==2.3.0" chess certifi pytest

      - name: Stockfish para os testes
        run: |
          curl -sSL -o sf.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar
          tar xf sf.tar
          echo "HED_STOCKFISH=$PWD/stockfish/stockfish-ubuntu-x86-64-avx2" >> $GITHUB_ENV

      - name: Testes de núcleo
        run: python hed_core.py && python hed_auto.py && python hed_plano.py && python hed_livro.py && python hed_classe.py && python hed_revisao.py

      - name: Testes de tela
        run: tests/rodar.sh

      - name: Enviar logs dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testes-log
          path: tests/saida

  # Só publica se o APK foi gerado E os testes de tela passaram.
  publicar:
    needs: [build, testes-tela]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: hed-apk
          path: bin

      - name: Publicar APK numa Release (download direto, sem login)
        run: |
          V=$(grep -E '^version *=' buildozer.spec | head -1 | cut -d= -f2 | tr -d ' ')
          echo "VERSAO=$V" >> $GITHUB_ENV
          cp bin/*.apk hed.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: HED ${{ env.VERSAO }}
          make_latest: true
          files: hed.apk
