name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Buildozer (versões fixas que funcionam juntas)
        run: pip install "buildozer==1.5.0" "cython==0.29.36" "setuptools<70" virtualenv

      - name: Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

      - name: Testar núcleo
        run: python hed_core.py

      - name: Gerar APK
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Mostrar erro (se falhar)
        if: failure()
        run: |
          echo "===== LINHAS COM ERRO ====="
          grep -n -i -E "error|exception|failed|not found" build.log | tail -40 || true
          echo "===== FINAL DO LOG ====="
          tail -150 build.log || true

      - name: Enviar log (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: hed-apk
          path: bin/*.apk
